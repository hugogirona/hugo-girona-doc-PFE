<section class="border-b border-hairline-strong">
  <div class="mx-auto max-w-6xl px-6 md:px-8 py-16 md:py-20">
    <div class="flex flex-wrap items-center gap-2 font-mono text-sm">
      <a href="{{root}}index.html#sommaire" class="link">← Retour au sommaire</a>
      {{#if crumbHref}}
      <span class="text-muted" aria-hidden="true">/</span>
      <a href="{{root}}pages/{{crumbHref}}" class="link">{{crumbTitle}}</a>
      {{/if}}
    </div>
    <div class="mt-10 flex items-baseline gap-4">
      <span class="font-mono text-base text-accent" aria-hidden="true">{{num}}</span>
      <h2 class="h-hero">
        {{title}}
      </h2>
    </div>
    <p class="mt-6 max-w-[60ch] text-lg leading-relaxed text-muted">{{{lede}}}</p>
  </div>
</section>
