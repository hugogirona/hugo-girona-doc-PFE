<section class="border-b border-hairline-strong">
  <div class="mx-auto max-w-6xl px-6 md:px-8 py-14 md:py-20">
    <a href="{{root}}index.html#sommaire" class="link font-mono text-sm">← Retour au sommaire</a>
    <div class="mt-10 flex items-baseline gap-4">
      <span class="font-mono text-base text-accent" aria-hidden="true">{{num}}</span>
      <h2
        class="font-display font-semibold tracking-tight"
        style="font-size: clamp(2.25rem, 5vw, 3.75rem); line-height: 1; letter-spacing: -0.03em"
      >
        {{title}}
      </h2>
    </div>
    <p class="mt-6 max-w-[60ch] text-lg leading-relaxed text-muted">{{lede}}</p>
  </div>
</section>
